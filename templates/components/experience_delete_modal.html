<div
    id="delete-experience-{{ experience.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-labelledby="delete-experience-title-{{ experience.id }}"
    aria-describedby="delete-experience-description-{{ experience.id }}"
>
    <button
        type="button"
        class="project-delete-modal__backdrop"
        popovertarget="delete-experience-{{ experience.id }}"
        popovertargetaction="hide"
        aria-label="Close delete confirmation"
    ></button>

    <div class="project-delete-modal__content glass-surface">
        <button
            type="button"
            class="project-delete-modal__close"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"
        >
            &times;
        </button>

        <p class="eyebrow">Delete experience</p>
        <h2 id="delete-experience-title-{{ experience.id }}">
            Let this chapter go?
        </h2>
        <p id="delete-experience-description-{{ experience.id }}">
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>?
            This action cannot be undone.
        </p>

        <div class="project-delete-modal__actions">
            <button
                type="button"
                class="button button-secondary"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                autofocus
            >
                Cancel
            </button>

            <form
                method="post"
                action="{% url 'main:delete_experience' experience.id %}"
            >
                {% csrf_token %}
                <button type="submit" class="button button-danger">
                    Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>
