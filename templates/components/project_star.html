<form
    method="post"
    action="{% url 'main:toggle_star' project.id %}"
    class="project-star"
>
    {% csrf_token %}

    {% if user in project.starred_by.all %}
        <button
            type="submit"
            class="project-star__button project-star__button--starred"
            aria-label="Unstar {{ project.title }}"
            title="Unstar this project"
        >
            <span class="project-star__icon" aria-hidden="true">&#9733;</span>
            <span>Starred</span>
            <span class="project-star__count">{{ project.starred_by.count }}</span>
        </button>
    {% else %}
        <button
            type="submit"
            class="project-star__button"
            aria-label="{% if user.is_authenticated %}Star{% else %}Sign in to star{% endif %} {{ project.title }}"
        >
            <span class="project-star__icon" aria-hidden="true">&#9734;</span>
            <span>Star</span>
            <span class="project-star__count">{{ project.starred_by.count }}</span>
        </button>
    {% endif %}
</form>
