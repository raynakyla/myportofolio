<div
    id="toast-component"
    class="toast toast--normal"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    aria-hidden="true"
>
    <span id="toast-icon" class="toast__icon" aria-hidden="true">✦</span>
    <div class="toast__content">
        <strong id="toast-title" class="toast__title"></strong>
        <p id="toast-message" class="toast__message"></p>
    </div>
</div>
